name: Change season

on:
  # Every day at 00:30 UTC (06:00 in Mumbai). It only commits when something
  # changed: a new season, or the journey's "now" moving to a new month.
  schedule:
    - cron: '30 0 * * *'
  # Run it by hand from the Actions tab to pick a season.
  workflow_dispatch:
    inputs:
      season:
        description: 'Season to show (auto = follow the calendar)'
        type: choice
        default: auto
        options: [auto, night, fall, winter, spring]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fonttools brotli pillow
      # A manual run saves its choice to season.txt; scheduled runs keep it.
      - run: python scripts/build.py ${{ inputs.season }}
      - name: Commit if anything changed
        run: |
          git add README.md season.txt art
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repaint the profile ($(cat season.txt))"
          git push
